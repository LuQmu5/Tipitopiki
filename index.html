<!DOCTYPE html>
<html lang="en-us">
  <head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Tipitopiki v.1.9f</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Tipitopiki</div>
      </div>
    </div>
    <script>
      // promo codes
      var FIRST_PROMO = "frstprm123";
      var SECOND_PROMO = "scndprm456";

      // vk api
      const VK_PUBLIC_ID = 223821229;
      const STORY_IMAGE_URL = "https://sun7-21.userapi.com/impg/UkXRUNcduKhdpUF8ciXY5imruHfq7xVwTJ7eWQ/8TQQOkNWJsc.jpg?size=1024x950&quality=95&sign=a50d9660b5e03eef519e2490291b7d8a&type=album";
      
      // unity interactions
      const UNITY_CONNECTOR_NAME = "UnityConnector";
      const DEVTOOL_ClearPrefsButton = "DEVTOOL_ClearPrefsButton";
      const DEVTOOL_CompleteGameButton = "DEVTOOL_CompleteGameButton";
      const MainMenu = "MainMenu";
      
      var myGameInstance = null;
      var dev_tools_enabled = true;

      // method names
      const DEVTOOL_HideButton = "HideButton";
      const UnityConnector_LoadUserState = "LoadUserState";
      const UnityConnector_SetNewState = "SetNewState";
      const UnityConnector_SetActivePromoCode = "SetActivePromoCode";
      const MainMenuManager_HideSubscribeCurtain = "HideSubscribeCurtain";

      // UserStates
      const USER_STATES_NotSubscribed = 0;
      const USER_STATES_GameNotCompleted = 1;
      const USER_STATES_GameCompleted = 2;
      const USER_STATES_RewardClaimed = 3;

      // PromoNames
      const PROMO_NAMES_TwelvePercent = 0;
      const PROMO_NAMES_SevenPercent = 1;

      
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/TipitopikiBuildWeb.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/TipitopikiBuildWeb.data.unityweb",
        frameworkUrl: buildUrl + "/TipitopikiBuildWeb.framework.js.unityweb",
        codeUrl: buildUrl + "/TipitopikiBuildWeb.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "VegmaGames",
        productName: "Tipitopiki",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
          
                // init unity on load
                myGameInstance = unityInstance;
                onGameSceneInited();
                // init unity on load
          
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>

    <!--user script-->
    <script>
      function claimReward(id)
      {
        if (id == PROMO_NAMES_TwelvePercent)
        {
          postStory();
        }
        else if (id == PROMO_NAMES_SevenPercent)
        {
          myGameInstance.SendMessage(UNITY_CONNECTOR_NAME, UnityConnector_SetActivePromoCode, SECOND_PROMO);     
          myGameInstance.SendMessage(UNITY_CONNECTOR_NAME, UnityConnector_SetNewState, USER_STATES_RewardClaimed);
        }
      }
      
      function checkForDevTools()
      {
        if (dev_tools_enabled == false)
        {
          myGameInstance.SendMessage(DEVTOOL_ClearPrefsButton, DEVTOOL_HideButton);
          myGameInstance.SendMessage(DEVTOOL_CompleteGameButton, DEVTOOL_HideButton);
        }
      }

      function onSDKInited()
      {
        console.log("sdk inited");    
      }

      function onGameCompleted()
      {
        console.log("game completed");
        myGameInstance.SendMessage(UNITY_CONNECTOR_NAME, UnityConnector_SetNewState, USER_STATES_GameCompleted);
      }

      function onGameStarted()
      {
        console.log("game started");
      }

      function subToVKEvents()
      {  
        vkBridge.subscribe(event => {          
          if (event.detail.type == 'VKWebAppShowStoryBoxResult')
          {
              if (event.detail.data.result) 
              {
                myGameInstance.SendMessage(UNITY_CONNECTOR_NAME, UnityConnector_SetActivePromoCode, FIRST_PROMO);
                myGameInstance.SendMessage(UNITY_CONNECTOR_NAME, UnityConnector_SetNewState, USER_STATES_RewardClaimed);
              } 
          }
          else if (event.detail.type == "VKWebAppJoinGroupResult")
          {
              if (event.detail.data.result) 
              {
                myGameInstance.SendMessage(MainMenu, MainMenuManager_HideSubscribeCurtain);  
                myGameInstance.SendMessage(UNITY_CONNECTOR_NAME, UnityConnector_LoadUserState);
              }
          }
        });
      }

      function postStory()
      {
          vkBridge.send('VKWebAppShowStoryBox', {
          background_type: 'image',
          url : STORY_IMAGE_URL,
          attachment: {
            text: 'book',
            type: 'photo',
            owner_id: 743784474,
            id: 12345678
          }})
          .then((data) => {
            if (data.code_data) {
              console.log(data);
            }})
          .catch((error) => {
            console.log(error);
          });
      }
      
      function onGameSceneInited()
      {
        console.log("game scene inited");  
        myGameInstance.SendMessage(UNITY_CONNECTOR_NAME, UnityConnector_SetNewState, USER_STATES_NotSubscribed);
        checkForDevTools();
        checkSubscribe();
      }
      
      function checkSubscribe()
      { 
        console.log("check sub");
        
        vkBridge.send('VKWebAppJoinGroup', {
        group_id: VK_PUBLIC_ID
        })
        .then((data) => { 
          if (data.result) {
            alert("subbed");
            console.log(data);
          }
        })
        .catch((error) => {
          console.log(error);
          myGameInstance.SendMessage(MainMenu, MainMenuManager_HideSubscribeCurtain);  
        });
      }
      
      // App Init
      jQuery(document).ready(function($)
      {
        vkBridge.send('VKWebAppInit');

        subToVKEvents();
      }); 
    </script>
  </body>
</html>
